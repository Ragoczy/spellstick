name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix api
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Build the auth API (typecheck)
        run: npm run build --prefix api
      - name: Headless sim (smoke)
        run: npm run sim -- --games 50 --seed 1
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke test
        run: npm run test:e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
      - name: Upload the built site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error

  # Balance thresholds from CLAUDE.md are hard failures from M6 on: 1,000 games at a fixed seed.
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Headless sim, 1,000 games (strict)
        run: npm run sim -- --games 1000 --seed 1 --strict

  # Azure Static Web Apps (Free): the built game from dist/, plus the Discord login functions in api/
  # (built by the deploy action). The token is a repo secret: AZURE_STATIC_WEB_APPS_API_TOKEN.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-and-build, balance]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://spellstick.games.darkspace.press
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          output_location: ''
          skip_app_build: true
