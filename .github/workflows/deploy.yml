name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Build the server
        run: npm run build:server
      - name: Headless sim (smoke)
        run: npm run sim -- --games 50 --seed 1
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke test
        run: npm run test:e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

  # Balance thresholds from CLAUDE.md are hard failures from M6 on: 1,000 games at a fixed seed.
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Headless sim, 1,000 games (strict)
        run: npm run sim -- --games 1000 --seed 1 --strict

  # Azure Container Apps (see infra/README.md). Signs in as id-game-spellstick-deploy, which
  # trusts only this repo's main branch, so no Azure password is stored in GitHub.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-and-build, balance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # No `environment:` here: it would change the OIDC subject to ...:environment:production,
    # which the federated credential (…:ref:refs/heads/main) doesn't match.
    env:
      IMAGE: acrha7siia4h4zia.azurecr.io/game-spellstick:${{ github.sha }}
      APP: ca-game-spellstick
      RG: rg-game-spellstick
      URL: https://ca-game-spellstick.proudbush-0a90b692.eastus2.azurecontainerapps.io
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push the image
        run: |
          az acr login -n acrha7siia4h4zia
          docker build --build-arg BUILD_SHA=${{ github.sha }} -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Switch the app to the new image
        run: |
          rev=$(az containerapp update -g "$RG" -n "$APP" --image "$IMAGE" --query properties.latestRevisionName -o tsv)
          echo "New revision: $rev"
          echo "REVISION=$rev" >> "$GITHUB_ENV"
      - name: Check the new version is healthy
        run: |
          for i in $(seq 1 30); do
            # A request wakes the app if it has stopped for being idle.
            curl -s -o /dev/null --max-time 20 "$URL/healthz" || true
            state=$(az containerapp revision show -g "$RG" -n "$APP" --revision "$REVISION" --query properties.healthState -o tsv)
            if [ "$state" = "Healthy" ]; then echo "Live at $URL ($REVISION)"; exit 0; fi
            echo "Waiting ($state)..."
            sleep 10
          done
          echo "The new version didn't become healthy. Logs: az containerapp logs show -g $RG -n $APP" >&2
          exit 1
